version = 1
SPDX-PackageName = "sanad"
SPDX-PackageSupplier = "Wonmor <https://github.com/wonmortech>"
SPDX-PackageDownloadLocation = "https://github.com/wonmortech/sanad"

# Every file that takes a comment carries its own SPDX header (`reuse lint` runs in the CI `build` job).
# Listed here are only the files that cannot: documentation, data, images and lock files.
[[annotations]]
path = [
  "**/*.md",
  "package.json",
  "package-lock.json",
  "site/*.png",
  "site/robots.txt",
  "site/sitemap.xml",
  "site/.well-known/security.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wonmor and Sanad contributors"
SPDX-License-Identifier = "Apache-2.0"

# Self-hosted fonts (subsets of the upstream releases) and their licence files: SIL Open Font License 1.1.
# Holders as stated in each font's name table and in site/fonts/LICENSE-*.txt.
[[annotations]]
path = ["site/fonts/sans-latin.woff2", "site/fonts/sans-latin-ext.woff2", "site/fonts/LICENSE-hanken-grotesk.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Hanken Grotesk Project Authors <https://github.com/marcologous/hanken-grotesk>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/sans-cyrillic.woff2", "site/fonts/sans-cyrillic-ext.woff2", "site/fonts/LICENSE-onest.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Onest Project Authors <https://github.com/simpals/onest>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/mono-latin.woff2", "site/fonts/mono-cyrillic.woff2", "site/fonts/LICENSE-jetbrains-mono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors <https://github.com/JetBrains/JetBrainsMono>"
SPDX-License-Identifier = "OFL-1.1"

# The font files name Adobe as the holder; the licence file as downloaded says only "Google Inc." (the packager).
[[annotations]]
path = ["site/fonts/serif-*.woff2", "site/fonts/LICENSE-source-serif-4.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Adobe Systems Incorporated <http://www.adobe.com/>, with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"
